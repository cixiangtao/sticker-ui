name: Publish package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run release contract
        run: pnpm run ci
      - name: Validate version and select release channel
        id: release
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"

          if [[ "v${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

          if [[ "${package_version}" == *-* ]]; then
            if [[ "${package_version}" != *-beta.* ]]; then
              echo "Unsupported prerelease channel in ${package_version}." >&2
              exit 1
            fi

            echo "npm-tag=beta" >> "${GITHUB_OUTPUT}"
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "npm-tag=latest" >> "${GITHUB_OUTPUT}"
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "package-version=${package_version}" >> "${GITHUB_OUTPUT}"
      - name: Publish to npm with trusted publishing
        env:
          NPM_TAG: ${{ steps.release.outputs.npm-tag }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package-version }}
        shell: bash
        run: |
          if npm view "sticker-ui@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "sticker-ui@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            npm publish --access public --tag "${NPM_TAG}"
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; skipping creation."
            exit 0
          fi

          release_args=(
            "${GITHUB_REF_NAME}"
            --verify-tag
            --title "${GITHUB_REF_NAME}"
            --generate-notes
          )

          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi

          gh release create "${release_args[@]}"
